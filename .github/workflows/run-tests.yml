name: Saucedemo Test Suite - Tests

on:
  push:
    branches: [ feature-branch ]
  pull_request:
    branches: [ feature-branch ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  run-saucedemo-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          sudo apt-get install -y libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libpango-1.0-0 libpangocairo-1.0-0

      - name: Run Tests with Maven
        run: mvn clean test -Dbrowser=chrome -DHEADLESS=true

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Test Results
          path: 'target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/extent-reports/
            target/allure-results/
          retention-days: 30