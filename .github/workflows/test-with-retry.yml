name: Tests with Retry Logic

on:
  push:
    branches: [ feature-branch ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'testng.xml'
  pull_request:
    branches: [ feature-branch ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'testng.xml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test-with-retry:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome Browser and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          sudo apt-get install -y libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libpango-1.0-0 libpangocairo-1.0-0

      - name: Run Tests with Maven Retry
        run: |
          mvn clean test \
            -Dbrowser=chrome \
            -DHEADLESS=true \
            -Dsurefire.rerunFailingTestsCount=1 \
            --fail-at-end

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/extent-reports/
          retention-days: 30

      - name: Comment PR with Test Results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { parseStringPromise } = require('xml2js');
            
            const resultsPath = './target/surefire-reports';
            
            if (!fs.existsSync(resultsPath)) {
              console.log('No surefire reports found.');
              return;
            }
            
            let totalTests = 0, totalFailures = 0, totalErrors = 0, totalSkipped = 0;
            
            const files = fs.readdirSync(resultsPath).filter(f => f.endsWith('.xml') && f.startsWith('TEST-'));
            
            for (const file of files) {
              const content = fs.readFileSync(path.join(resultsPath, file), 'utf8');
              const parsed = await parseStringPromise(content);
              const suite = parsed.testsuite.$;
              totalTests    += parseInt(suite.tests    || 0);
              totalFailures += parseInt(suite.failures || 0);
              totalErrors   += parseInt(suite.errors   || 0);
              totalSkipped  += parseInt(suite.skipped  || 0);
            }
            
            const passed = totalTests - totalFailures - totalErrors - totalSkipped;
            const status = (totalFailures + totalErrors) > 0 ? '❌ Some tests failed' : '✅ All tests passed';
            
            const comment = [
              '## Test Execution Summary',
              '',
              `**Status**: ${status}`,
              '',
              '| Result | Count |',
              '|--------|-------|',
              `| ✅ Passed  | ${passed} |`,
              `| ❌ Failed  | ${totalFailures} |`,
              `| 🔥 Errors  | ${totalErrors} |`,
              `| ⏭️ Skipped | ${totalSkipped} |`,
              `| 📋 Total   | ${totalTests} |`,
              '',
              '> Check the **Artifacts** section for detailed reports.'
            ].join('\n');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });