name: Manual Test Execution

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge
      environment:
        description: 'Test Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  manual-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Install Browser - Chrome
      if: inputs.browser == 'chrome'
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    
    - name: Install Browser - Firefox
      if: inputs.browser == 'firefox'
      run: |
        sudo apt-get update
        sudo apt-get install -y firefox
    
    - name: Run Tests
      run: mvn clean test -Dbrowser=${{ inputs.browser }} -Denvironment=${{ inputs.environment }}
    
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: manual-test-reports-${{ inputs.browser }}
        path: reports/
        retention-days: 30
    
    - name: Upload Screenshots on Failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: failure-screenshots-${{ inputs.browser }}
        path: reports/screenshots/
        retention-days: 14

