name: Nightly Test Execution

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  nightly-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome Browser and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          sudo apt-get install -y libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libpango-1.0-0 libpangocairo-1.0-0

      - name: Run Full Test Suite
        run: mvn clean test -Dbrowser=chrome -DsuiteXmlFile=testng.xml -DHEADLESS=true

      - name: Generate Test Summary
        if: always()
        run: |
          echo "Test execution completed at $(date)" > target/test-summary.txt
          echo "Triggered by: ${{ github.event_name }}" >> target/test-summary.txt

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-reports
          path: |
            target/surefire-reports/
            target/extent-reports/
            target/test-summary.txt
          retention-days: 60

      - name: Create GitHub Issue on Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Nightly Tests Failed - ' + new Date().toDateString(),
              body: `## Nightly Test Failure\n\n- **Date**: ${new Date().toISOString()}\n- **Workflow Run**: [View Logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\nPlease investigate the failure and fix before next nightly run.`,
              labels: ['bug', 'automated-test']
            })